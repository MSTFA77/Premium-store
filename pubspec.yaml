name: prime_shopping
description: A modern glassmorphic Flutter shopping app (Elevate Flutter Filtration Task).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency injection (service locator)
  get_it: ^8.0.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
